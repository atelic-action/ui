name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# CI runs on pull requests only, the check before a merge into main; a push
# to main runs nothing, and a newer push to the same pull request cancels the
# run before it (Forni, 2026-10-23, after the org's Actions budget ran out).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test:run

      - name: Build the gate, then load it the way a Vercel function does
        run: bun run build && bun run build:smoke

      - name: Build the gallery
        run: bun run gallery:build
